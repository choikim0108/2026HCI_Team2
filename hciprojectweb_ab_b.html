<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>한림대 수강신청 Prototype B</title>
    <script type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="courses.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --hallym-blue: #00305d;
            --hallym-blue-bright: #0058a8;
            --timetable-border: #c7dcf1;
            --course-yellow: #fff9c4;
            --overlap-red-soft: #ffe1e6;
            --overlap-red: #f23557;
            --overlap-red-deep: #9f1239;
            --registered-blue: #d7efff;
            --registered-blue-border: #36a3ff;
            --registered-blue-soft: #eaf7ff;
            --overlap-pastel-red: #ffb8c0;
            --highlight-blue: #00aee8;
            --accent-red: #f23557;
            --bg-gray: #f4f7f9;
            --wait-orange: #ff7a00;
            --text-main: #22384d;
            --text-muted: #536576;
            --mobile-shell-width: 430px;
        }

        body { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 15.5px; background: var(--bg-gray); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--hallym-blue); color: white; padding: 14px 30px; display: flex; justify-content: space-between; align-items: flex-start; box-sizing: border-box; gap: 20px; }
        .header-main { display: flex; flex-direction: column; gap: 6px; }
        .header-left { white-space: nowrap; font-weight: bold; letter-spacing: 1px; line-height: 1.2; }
        .header-time-row,
        .header-user-row { display: flex; align-items: center; }
        .header-actions { display: flex; align-items: stretch; gap: 12px; padding-top: 2px; }
        .user-meta { font-size: 0.9em; text-align: right; line-height: 1.35; min-height: 24px; display: flex; align-items: center; }
        .user-major { display: inline-flex; align-items: center; gap: 8px; }
        .server-time { font-size: 0.9em; opacity: 0.9; color: #ffffff; min-height: 22px; display: inline-flex; align-items: center; }
        .server-time.time-warning { color: var(--accent-red); font-weight: 700; }
        .roadmap-btn { display: inline-block; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; padding: 3px 8px; font-size: 0.8em; font-weight: 700; text-decoration: none; }
        .roadmap-btn:hover { background: rgba(255,255,255,0.3); }
        .theme-toggle-btn { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; padding: 7px 12px; font-size: 0.78em; font-weight: 700; cursor: pointer; min-height: 38px; min-width: 88px; display: inline-flex; align-items: center; justify-content: center; }
        .theme-toggle-btn:hover { background: rgba(255,255,255,0.3); }
        .mobile-toggle-btn { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; padding: 7px 12px; font-size: 0.78em; font-weight: 700; cursor: pointer; min-height: 38px; min-width: 88px; display: inline-flex; align-items: center; justify-content: center; }
        .mobile-toggle-btn:hover { background: rgba(255,255,255,0.24); }
        .container { display: flex; flex: 1; overflow: hidden; padding: 15px; gap: 0; align-items: stretch; }

        /* Left Section Style */
        .left-section { flex: 1.3; display: flex; flex-direction: column; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); box-sizing: border-box; min-width: 0; }
        .resize-handle { width: 14px; flex: 0 0 14px; cursor: col-resize; position: relative; }
        .resize-handle::before { content: ''; position: absolute; left: 50%; top: 12px; bottom: 12px; width: 3px; transform: translateX(-50%); border-radius: 999px; background: #c6d4e4; transition: background 0.2s, box-shadow 0.2s; }
        .resize-handle:hover::before { background: #9db8d4; box-shadow: 0 0 0 3px rgba(157, 184, 212, 0.2); }
        body.is-resizing { cursor: col-resize; user-select: none; }
        .search-box { padding: 18px 18px 14px; border-bottom: 1px solid #edf1f5; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
        .search-row { display: flex; gap: 10px; align-items: center; }
        .search-input-wrap { position: relative; flex: 1; min-width: 0; }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #7390aa; font-size: 1.05em; pointer-events: none; }
        .search-box input { width: 100%; padding: 12px 14px 12px 42px; border: 1px solid #d5dee8; border-radius: 10px; box-sizing: border-box; font-size: 0.98em; min-height: 48px; }
        .search-box input:focus { outline: none; border-color: #74a9dd; box-shadow: 0 0 0 4px rgba(116, 169, 221, 0.16); }
        .search-clear-btn { flex: 0 0 auto; min-width: 76px; min-height: 48px; padding: 11px 12px; border: 1px solid #d5dee8; border-radius: 10px; background: #f8fbfe; color: var(--hallym-blue); font-weight: 700; cursor: pointer; }
        .search-clear-btn:hover { background: #edf5fc; }
        .search-helper { margin-top: 10px; font-size: 0.8em; color: #607286; line-height: 1.5; }
        .search-meta { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.78em; color: #6c7d90; }
        .search-count { font-weight: 700; color: var(--hallym-blue); }
        .search-keyword { padding: 3px 8px; border-radius: 999px; background: #eef5ff; color: #285f92; font-weight: 700; }
        
        .summary-bar { background: #f1f3f5; padding: 12px 15px; font-size: 0.9em; text-align: center; font-weight: bold; border-bottom: 1px solid #ddd; min-height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
        .summary-bar .total-label { color: #333; }
        .summary-bar .wait-val { color: var(--wait-orange); }

        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #ddd; align-items: stretch; }
        .tab-btn { flex: 1; min-height: 50px; padding: 12px 10px; border: none; cursor: pointer; font-weight: bold; background: #f8f9fa; color: #666; transition: 0.2s; display: flex; align-items: center; justify-content: center; text-align: center; }
        .tab-btn.active { background: white; color: var(--hallym-blue); border-bottom: 3px solid var(--hallym-blue); }
        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .tab-content.active { display: block; }

        /* Category Tag System */
        .category-tag { display: inline-block; width: fit-content; align-self: flex-start; padding: 3px 9px; border-radius: 6px; font-size: 0.74em; font-weight: bold; margin-bottom: 6px; color: white; }
        .tag-전공 { background: #1976d2; }
        .tag-오디세이세미나 { background: #388e3c; }
        .tag-정보소통, .tag-의사소통, .tag-글로벌소통 { background: #f57c00; }
        .tag-생애설계 { background: #d32f2f; }
        .tag-스포츠웰니스 { background: #00796b; }
        .tag-교양이수학점 { background: #607d8b; }

        /* Course Card Style */
        .course-card { border: 1px solid #e7edf4; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; background: #fff; transition: 0.2s; position: relative; display: flex; flex-direction: column; gap: 0; }
        .course-card:hover { border-color: var(--hallym-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .course-card.selected-course { background: #f2f9ff; border-color: var(--registered-blue-border); }
        .course-card.hidden { display: none; }
        .course-card-topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
        .course-card-title { flex: 1; min-width: 0; }
        .course-code { display: inline-flex; align-items: center; padding: 3px 8px; margin-left: 8px; border-radius: 999px; background: #edf4fb; color: #3b5e80; font-size: 0.72em; font-weight: 700; vertical-align: middle; transform: translateY(-1px); }
        .course-status-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; gap: 6px; min-width: 126px; }
        .status-badge { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; font-size: 0.74em; font-weight: 800; }
        .status-open { background: #d9f8e6; color: #05723b; }
        .status-wait { background: #fff0dc; color: #c45600; }
        .status-registered { background: #d9f0ff; color: #006aad; }
        .status-full { background: #ffe2e6; color: #d7193f; }
        .course-primary-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 6px; }
        .course-primary-meta span { font-weight: 600; color: #475867; }
        .course-primary-meta strong { color: #1f2f3d; }
        .course-time-line { color: #3d6b97; font-weight: 700; }
        .course-enrollment-line { color: #536576; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .course-name { font-weight: bold; font-size: 1.12em; color: var(--hallym-blue); margin-bottom: 4px; display: block; line-height: 1.45; }
        .course-info { font-size: 0.91em; color: #5a6a79; line-height: 1.65; display: flex; flex-direction: column; gap: 4px; }
        .full-people { color: var(--accent-red) !important; font-weight: bold; }
        .wait-people { color: var(--wait-orange) !important; font-weight: bold; }

        .btn-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; width: 100%; }
        .btn-reg, .btn-syllabus, .btn-cancel { width: 100%; box-sizing: border-box; padding: 8px 13px; border-radius: 8px; border: none; font-weight: bold; font-size: 0.78em; cursor: pointer; transition: 0.2s; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
        .btn-reg { background: var(--hallym-blue-bright); color: white; box-shadow: 0 2px 8px rgba(0, 88, 168, 0.22); }
        .btn-reg:hover { background: #006dcc; }
        .btn-reg-waiting { background: var(--wait-orange); }
        .btn-reg-waiting:hover { background: #d86a10; }
        .btn-reg-registered { background: #f36c6c; color: #fff; box-shadow: 0 2px 8px rgba(243, 108, 108, 0.22); }
        .btn-reg-registered:hover { background: #e24f4f; }
        .btn-syllabus { background: #607d8b; color: white; }
        .btn-cancel { background: #f36c6c; color: white; }

        .btn-cart { width: 100%; box-sizing: border-box; background: #0097b2; color: white; padding: 8px 13px; border-radius: 8px; border: none; font-weight: bold; font-size: 0.78em; cursor: pointer; transition: 0.2s; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
        .btn-cart:hover { background: #00838f; }
        .empty-state { margin-top: 28px; padding: 20px 18px; border: 1px dashed #c7d8ea; border-radius: 12px; background: #f8fbff; text-align: center; color: #607286; line-height: 1.6; }
        .empty-state.compact-empty { margin-top: 24px; }
        .registered-card .course-info { margin-bottom: 14px; }
        .registered-card .btn-cancel { margin-top: 2px; }


        .cart-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
        .cart-bulk-btn { padding: 6px 12px; border-radius: 4px; border: none; background: var(--hallym-blue); color: #fff; font-weight: bold; font-size: 0.8em; cursor: pointer; }
        .cart-bulk-btn:disabled { opacity: 0.5; cursor: default; }
        .cart-index { font-weight: bold; margin-right: 8px; color: var(--hallym-blue); }
        .cart-controls { display: flex; gap: 4px; margin-top: 6px; }
        .btn-cart-small { padding: 3px 6px; font-size: 0.72em; border-radius: 4px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; }
        .btn-cart-small:hover { background: #e9ecef; }

        /* Mobile simulation mode (visual only) */
        .mobile-timetable-toggle { display: none; margin: 8px 0 4px; padding: 8px 12px; font-size: 0.8em; border-radius: 8px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-weight: 600; box-sizing: border-box; width: 100%; }
        .mobile-timetable-toggle:hover { background: #e9ecef; }

        body.mobile-sim { background: #0f1722; }
        body.mobile-sim header,
        body.mobile-sim .container { max-width: var(--mobile-shell-width); width: var(--mobile-shell-width); margin: 0 auto; }
        body.mobile-sim header { padding: 10px 18px; border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,0.45); align-items: flex-start; }
        body.mobile-sim .header-main { flex: 1; }
        body.mobile-sim .header-left { font-size: 1.35em; letter-spacing: 1.5px; margin-bottom: 6px; }
        body.mobile-sim .header-time-row,
        body.mobile-sim .header-user-row { font-size: 0.85em; }
        body.mobile-sim .header-actions { gap: 10px; flex-direction: column; align-items: stretch; }
        body.mobile-sim .server-time,
        body.mobile-sim .user-meta { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,0.35); }
        body.mobile-sim .roadmap-btn { border-radius: 999px; font-size: 0.7em; padding: 2px 7px; }
        body.mobile-sim .mobile-toggle-btn,
        body.mobile-sim .theme-toggle-btn { border-radius: 999px; padding: 6px 8px; font-size: 0.7em; min-width: 96px; }
        body.mobile-sim .container { flex-direction: column; padding: 10px 12px 20px; box-sizing: border-box; }
        body.mobile-sim .resize-handle { display: none; }
        body.mobile-sim .left-section,
        body.mobile-sim .right-section { flex: 0 0 auto; width: 100%; border-radius: 18px; }

        body.mobile-sim .mobile-timetable-toggle { display: block; }
        body.mobile-sim .right-section { display: none; }
        body.mobile-sim.mobile-timetable-open .left-section { display: none; }
        body.mobile-sim.mobile-timetable-open .right-section { display: flex; }

        .mobile-timetable-back { display: none; margin-bottom: 8px; padding: 6px 10px; font-size: 0.8em; border-radius: 6px; border: 1px solid #ccc; background: #f8f9fa; cursor: pointer; font-weight: 600; }
        .mobile-timetable-back:hover { background: #e9ecef; }
        body.mobile-sim.mobile-timetable-open .mobile-timetable-back { display: inline-block; }

        /* Right Section & Timetable */
        .right-section { --timetable-scrollbar-width: 0px; flex: 2.1; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative; box-sizing: border-box; min-width: 0; }
        .timetable-topbar { display: flex; justify-content: space-between; align-items: stretch; gap: 12px; margin-bottom: 12px; }
        .timetable-title-card { flex: 1; text-align: center; font-weight: bold; background: #eef5ff; padding: 12px 14px; border-radius: 10px; color: var(--hallym-blue); min-height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
        .timetable-legend { min-width: 250px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px; padding: 10px 12px; background: #f8fbff; border: 1px solid #e3edf8; border-radius: 10px; min-height: 48px; box-sizing: border-box; }
        .timetable-alert { display: none; margin: -2px 0 12px; padding: 11px 14px; border: 1px solid #ff9aac; border-left: 5px solid var(--overlap-red); border-radius: 10px; background: #fff4f6; color: var(--overlap-red-deep); font-size: 0.86em; font-weight: 700; line-height: 1.55; box-shadow: 0 4px 12px rgba(242, 53, 87, 0.08); }
        .timetable-alert strong { color: #7f0d2b; }
        .legend-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.76em; color: #496173; font-weight: 700; }
        .legend-pill::before { content: ''; width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
        .legend-registered::before { background: var(--registered-blue-border); }
        .legend-waiting::before { background: #b9c1ca; }
        .legend-overlap::before { background: var(--overlap-pastel-red); }
        .grid-header { display: grid; grid-template-columns: 82px 82px repeat(5, 1fr); padding-right: var(--timetable-scrollbar-width); background: #f8f9fa; border: 1px solid var(--timetable-border); text-align: center; font-weight: bold; font-size: 0.82em; box-sizing: border-box; }
        .grid-header div { padding: 10px 0; border-right: 1px solid var(--timetable-border); min-height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
        .grid-container { display: grid; grid-template-columns: 82px 82px repeat(5, 1fr); grid-template-rows: repeat(22, 38px); background: var(--timetable-border); border: 1px solid var(--timetable-border); flex: 1; overflow-y: auto; }
        
        .cell { background: white; display: flex; align-items: center; justify-content: center; font-size: 0.72em; color: #888; border-right: 1px solid var(--timetable-border); border-bottom: 1px solid #f0f0f0; line-height: 1.2; text-align: center; word-break: break-all; padding: 2px; box-sizing: border-box; }
        .no-border-bottom { border-bottom: none !important; }
        .label-cell { background: #f8f9fa; color: #333; font-weight: 500; flex-direction: column; gap: 2px; padding: 4px 2px; }
        .label-main { font-size: 0.78em; font-weight: 700; line-height: 1.1; color: #22384d; }
        .label-sub { font-size: 0.62em; line-height: 1.1; color: #6a7f93; white-space: nowrap; }
        .day-cell { word-break: keep-all; padding: 4px; }
        .day-cell.course-cell-primary { flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 700; color: #0d3559; padding: 4px 6px; }
        .day-cell.course-cell-primary .course-cell-name { font-size: 15px; line-height: 1.12; word-break: keep-all; overflow-wrap: anywhere; max-width: 100%; }
        .day-cell.course-cell-primary .course-cell-time { font-size: 12px; opacity: 0.92; line-height: 1.1; }
        .day-cell.course-cell-primary.large-label .course-cell-name { font-size: 17px; }
        .day-cell.course-cell-primary.compact-label .course-cell-name { font-size: 13.5px; }
        .day-cell.course-cell-primary.xcompact-label .course-cell-name { font-size: 12.5px; }
        .day-cell.course-cell-primary .course-cell-name.single-line-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .day-cell.course-span-start { border-bottom-color: transparent !important; }
        .day-cell.course-span-middle { border-top-color: transparent !important; border-bottom-color: transparent !important; }
        .day-cell.course-span-end { border-top-color: transparent !important; }

        /* Timetable States */
        .fixed-course { background-color: var(--registered-blue) !important; color: #0d3559 !important; font-weight: bold; border: 1px solid var(--registered-blue-border) !important; }
        .fixed-waiting { background-color: #f1f3f5 !important; color: #adb5bd !important; border: 1px dashed #ccc !important; }
        .highlight-registered-focus { background-color: var(--overlap-red-soft) !important; box-shadow: inset 0 0 0 2px var(--overlap-red) !important; z-index: 10; color: var(--overlap-red-deep) !important; }
        .highlight-overlap { background-color: var(--overlap-red-soft) !important; color: var(--overlap-red-deep) !important; font-weight: bold !important; border-color: #ff7f96 !important; box-shadow: inset 0 0 0 2px var(--overlap-red) !important; z-index: 12; }
        .highlight-target { background-color: #e3f2fd !important; color: transparent !important; }

        /* Diagnosis Table Style */
        .diag-table { width: 100%; border-collapse: collapse; font-size: 0.82em; margin-top: 5px; }
        .diag-table th, .diag-table td { border: 1px solid #dee2e6; padding: 10px 4px; text-align: center; }
        .diag-table th { background: #e3f2fd; color: var(--hallym-blue); font-weight: bold; }
        .diag-table tbody tr:nth-child(even) { background: #f8fbff; }
        .diag-table tbody tr:hover { background: #eef5ff; }
        .diag-table .category-col { background: #f8f9fa; font-weight: bold; text-align: left; padding-left: 10px; }
        .diag-table td:not(.category-col) { font-variant-numeric: tabular-nums; }
        .val-reg { color: #1976d2; font-weight: bold; }
        .val-remain { color: #d32f2f; font-weight: bold; }
        .btn-lookup { padding: 4px 10px; background: #ef6c00; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75em; }

        /* Modal Style */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 450px; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: modalFadeIn 0.3s; box-sizing: border-box; }
        @keyframes modalFadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; color: var(--hallym-blue); border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .modal-footer { margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; }
        .btn-modal-confirm { padding: 8px 20px; background: var(--hallym-blue); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-modal-cancel { padding: 8px 20px; background: #eee; border: none; border-radius: 4px; cursor: pointer; color: #333; }
        .btn-modal-close { padding: 8px 20px; background: #607d8b; color: white; border: none; border-radius: 4px; cursor: pointer; }

        /* Dark Mode */
        body.dark-mode { --bg-gray: #141a22; --hallym-blue: #0c223d; --timetable-border: #324355; --course-yellow: #7d6a17; --overlap-pastel-red: #5a2d34; --overlap-red-soft: #5a2d34; --overlap-red: #ff7a7a; --overlap-red-deep: #ffd0d0; --highlight-blue: #4cc9f0; --accent-red: #ff7a7a; --wait-orange: #ffae42; }
        body.dark-mode header { background: #0b1729; border-bottom: 1px solid #233248; }
        body.dark-mode .theme-toggle-btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
        body.dark-mode .roadmap-btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

<script>
    let myRegistrations = [];

    function renderUserInfo() {
        $('#user-meta').html(`${USER_NAME} | ${USER_ID} | <span class="user-major">${escapeHtml(USER_MAJOR)} <a class="roadmap-btn" href="software_contentit.pdf" target="_blank" rel="noopener">전공 로드맵</a></span>`);
    }

    // 상단 서버 시간(현재는 로컬 PC 기준) 표시
    function formatTwoDigits(n) {
        return n < 10 ? '0' + n : n;
    }

    function updateServerTime() {
        const now = new Date();
        const year = now.getFullYear();
        const month = formatTwoDigits(now.getMonth() + 1);
        const day = formatTwoDigits(now.getDate());
        const hour = formatTwoDigits(now.getHours());
        const minute = formatTwoDigits(now.getMinutes());
        const second = formatTwoDigits(now.getSeconds());
        const millisecond = String(now.getMilliseconds()).padStart(3, '0');

        const text = `${year}-${month}-${day} | ${hour}:${minute}:${second}.${millisecond}`;

        const $time = $('#server-time');
        $time.text(text);

        // 매 시간 정각 10초 전(분이 59이고 초가 50~59초 구간)에는 빨간색 강조
        const secNum = now.getSeconds();
        const minNum = now.getMinutes();
        const isWarning = (minNum === 59 && secNum >= 50);
        $time.toggleClass('time-warning', isWarning);
    }

    // 시간표 유틸리티 함수
    function getAlphaId(idx) {
        if (idx >= 2 && idx < 5) return 'A';
        if (idx >= 5 && idx < 8) return 'B';
        if (idx >= 8 && idx < 11) return 'C';
        if (idx >= 11 && idx < 14) return 'D';
        if (idx >= 14 && idx < 17) return 'E';
        if (idx >= 17 && idx < 20) return 'F';
        return "";
    }

    function getPhysicalIndices(slot) {
        const s = slot.toUpperCase();
        const day = s.substring(0, 3);
        const code = s.substring(3).replace('-', '');
        let rows = [];
        if (!isNaN(code)) {
            const n = parseInt(code);
            rows = [n * 2, n * 2 + 1];
        } else {
            const alphaMap = { 'A': [2,3,4], 'B': [5,6,7], 'C': [8,9,10], 'D': [11,12,13], 'E': [14,15,16], 'F': [17,18,19] };
            rows = alphaMap[code] || [];
        }
        return rows.map(r => `${day}-${r}`);
    }

    function getNumericStartTime(period) {
        const baseHour = 9;
        const hour = baseHour + (period - 1);
        return `${formatTwoDigits(hour)}:00`;
    }

    function getAlphaStartTime(alpha) {
        const alphaMap = {
            A: '09:00',
            B: '10:30',
            C: '12:00',
            D: '13:30',
            E: '15:00',
            F: '16:30'
        };
        return alphaMap[alpha] || '';
    }

    function buildLabelCell(main, sub, extraClass) {
        const label = main === '' ? '' : `<span class="label-main">${main}</span>`;
        const time = sub ? `<span class="label-sub">${sub}</span>` : '';
        return `<div class="cell label-cell ${extraClass || ''}">${label}${time}</div>`;
    }

        $(document).ready(function() {
        renderUserInfo();
        // 서버 시간(로컬) 초기화 및 1초마다 갱신
        updateServerTime();
        setInterval(updateServerTime, 47);

            initThemeToggle();
            initMobileViewToggle();
            initMobileTimetableToggle();
            renderGrid();
            syncTimetableHeaderWidth();
            refreshFilteredCourseList();
            renderCart();
            updateUI();
            initResizeHandle();
            updateSearchMeta(window.courseData.length, window.courseData.length, '');
            
            $('#searchInput').on('input', function() {
                refreshFilteredCourseList();
                filterRegisteredList($(this).val().toLowerCase());
            });

            $('#clearSearchBtn').on('click', function() {
                $('#searchInput').val('');
                refreshFilteredCourseList();
                filterRegisteredList('');
                $('#searchInput').trigger('focus');
            });
        });

        function normalizeSearchText(text) {
            return String(text || '').toLowerCase().replace(/\s+/g, '');
        }

        function getCourseSearchScore(course, keyword) {
            const val = normalizeSearchText(keyword);
            if (!val) return 0;

            const name = normalizeSearchText(course.name);
            const num = normalizeSearchText(course.num);
            const prof = normalizeSearchText(course.prof);
            const dept = normalizeSearchText(course.dept);
            const category = normalizeSearchText(course.category);
            const time = normalizeSearchText(translateTime(course.time));

            if (name === val) return 100;
            if (num === val) return 95;
            if (name.startsWith(val)) return 90;
            if (name.includes(val)) return 80;
            if (prof.includes(val)) return 60;
            if (category.includes(val)) return 50;
            if (dept.includes(val)) return 35;
            if (time.includes(val)) return 25;
            return 0;
        }

        function getFilteredCourses(keyword) {
            const val = normalizeSearchText(keyword);
            if (!val) return window.courseData.slice();

            return window.courseData
                .map(c => ({ course: c, score: getCourseSearchScore(c, val) }))
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score || a.course.id - b.course.id)
                .map(item => item.course);
        }

        function refreshFilteredCourseList() {
            const keyword = $('#searchInput').val() || '';
            const filtered = getFilteredCourses(keyword);
            renderCourseList(filtered);
            updateSearchMeta(filtered.length, window.courseData.length, keyword);
        }

        function updateSearchMeta(currentCount, totalCount, keyword) {
            $('#search-count').text(`전체 ${totalCount}개 중 ${currentCount}개 표시`);
            $('#search-keyword').html(keyword ? `<span class="search-keyword">검색어: ${escapeHtml(keyword)}</span>` : '');
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

    function filterRegisteredList(keyword) {
        const normalizedKeyword = normalizeSearchText(keyword);
        $('#registered-container .course-card').each(function() {
            const text = normalizeSearchText($(this).text());
            $(this).toggleClass('hidden', !text.includes(normalizedKeyword));
        });
    }

    function initThemeToggle() {
        const themeKey = 'hci-theme-mode';
        const $btn = $('#theme-toggle-btn');

        function syncButtonText() {
            $btn.text($('body').hasClass('dark-mode') ? '라이트모드' : '다크모드');
        }

        if (localStorage.getItem(themeKey) === 'dark') {
            $('body').addClass('dark-mode');
        }
        syncButtonText();

        $btn.on('click', function() {
            $('body').toggleClass('dark-mode');
            const current = $('body').hasClass('dark-mode') ? 'dark' : 'light';
            localStorage.setItem(themeKey, current);
            syncButtonText();
        });
    }

    function initMobileViewToggle() {
        const mobileKey = 'hci-mobile-view';
        const $btn = $('#mobile-view-toggle-btn');

        function syncButtonText() {
            $btn.text($('body').hasClass('mobile-sim') ? 'PC버전' : '모바일버전');
        }

        if (localStorage.getItem(mobileKey) === 'on') {
            $('body').addClass('mobile-sim');
        }
        syncButtonText();

        $btn.on('click', function() {
            $('body').toggleClass('mobile-sim');
            // 데스크톱 모드로 돌아갈 때 시간표는 항상 숨김 상태로 초기화
            if (!$('body').hasClass('mobile-sim')) {
                $('body').removeClass('mobile-timetable-open');

            }
            const current = $('body').hasClass('mobile-sim') ? 'on' : 'off';

            syncButtonText();
        });
    }

    function initMobileTimetableToggle() {
        const $toggleBtn = $('#mobile-timetable-toggle');
        const $backBtn = $('#mobile-timetable-back');

        function updateState(isOpen) {
            $('body').toggleClass('mobile-timetable-open', isOpen);
            const label = isOpen ? '시간표 숨기기' : '시간표 보기';
            $toggleBtn.text(label);
        }

        $toggleBtn.on('click', function() {
            const isOpen = !$('body').hasClass('mobile-timetable-open');
            updateState(isOpen);
        });

        $backBtn.on('click', function() {
            updateState(false);
        });
    }

    function initResizeHandle() {
        const $container = $('.container');
        const $left = $('.left-section');
        const $right = $('.right-section');
        const $handle = $('#resize-handle');
        const minLeft = 360;
        const minRight = 520;

        let dragging = false;
        let startX = 0;
        let startLeft = 0;

        function getContainerContentWidth() {
            const containerEl = $container[0];
            const style = window.getComputedStyle(containerEl);
            const padLeft = parseFloat(style.paddingLeft) || 0;
            const padRight = parseFloat(style.paddingRight) || 0;
            return containerEl.clientWidth - padLeft - padRight;
        }

        function applyWidth(nextLeft) {
            const containerWidth = getContainerContentWidth();
            const handleWidth = $handle.outerWidth();
            const maxLeft = Math.max(minLeft, containerWidth - handleWidth - minRight);
            const clampedLeft = Math.max(minLeft, Math.min(nextLeft, maxLeft));
            const rightWidth = containerWidth - handleWidth - clampedLeft;

            $left.css('flex', `0 0 ${clampedLeft}px`);
            $right.css('flex', `0 0 ${rightWidth}px`);
            $handle.attr({
                'aria-valuemin': minLeft,
                'aria-valuemax': maxLeft,
                'aria-valuenow': Math.round(clampedLeft)
            });
        }

        $handle.on('mousedown', function(e) {
            e.preventDefault();
            dragging = true;
            startX = e.clientX;
            startLeft = $left.outerWidth();
            $('body').addClass('is-resizing');
        });

        $(document).on('mousemove', function(e) {
            if (!dragging) return;
            applyWidth(startLeft + (e.clientX - startX));
        });

        $(document).on('mouseup', function() {
            if (!dragging) return;
            dragging = false;
            $('body').removeClass('is-resizing');
        });

        $(window).on('resize', function() {
            if ($left.css('flex-grow') === '0') {
                applyWidth($left.outerWidth());
            }
            syncTimetableHeaderWidth();
        });
    }

    function syncTimetableHeaderWidth() {
        const grid = document.getElementById('timetable');
        if (!grid) return;
        const scrollbarWidth = Math.max(0, grid.offsetWidth - grid.clientWidth);
        const scrollbarWidthValue = `${scrollbarWidth}px`;
        $('.right-section').css('--timetable-scrollbar-width', scrollbarWidthValue);
        $('.grid-header').css('padding-right', scrollbarWidthValue);

    function renderGrid() {
        const days = ['MON', 'TUE', 'WED', 'THU', 'FRI'];
        const grid = $('#timetable').empty();
        for (let i = 0; i < 22; i++) {
            // 숫자 교시 라벨
            let period = (i >= 2 && i % 2 === 0) ? Math.floor(i/2) : 0;
            let numVal = period > 0 ? String(period) : "";
            let numTime = period > 0 ? getNumericStartTime(period) : "";
            let numBorder = (i % 2 === 0) ? "no-border-bottom" : "";
            grid.append(buildLabelCell(numVal, numTime, numBorder));
            
            // 알파벳 교시 라벨
            let currentAlpha = getAlphaId(i);
            let prevAlpha = getAlphaId(i-1);
            let nextAlpha = getAlphaId(i+1);
            let alphaVal = (currentAlpha !== prevAlpha) ? currentAlpha : "";
            let alphaTime = alphaVal ? getAlphaStartTime(alphaVal) : "";
            let alphaBorder = (currentAlpha !== "" && currentAlpha === nextAlpha) ? "no-border-bottom" : "";
            grid.append(buildLabelCell(alphaVal, alphaTime, alphaBorder));
            
            days.forEach(day => {
                let cellBorder = (i % 2 === 0) ? "no-border-bottom" : "";
                grid.append(`<div class="cell day-cell ${cellBorder}" id="cell-${day}-${i}"></div>`);
            });
        }
    }

    function setupHoverEffects(selector) {
        $(selector).off('mouseenter mouseleave').on('mouseenter', function() {
            const courseId = parseInt($(this).attr('data-id'));
            const course = window.courseData.find(c => c.id === courseId);
            if (!course) return;

            updateTimetableDisplay();
            hideOverlapWarning();

            const isAlreadyRegistered = myRegistrations.some(r => r.id === courseId);
            const conflicts = isAlreadyRegistered ? [] : getCourseConflicts(course);

            if (isAlreadyRegistered) {
                renderCoursePreview(course, 'highlight-registered-focus', course.name);
                return;
            }

            if (conflicts.length) {
                renderCoursePreview(course, 'highlight-overlap', '시간 중복');
                showOverlapWarning(course, conflicts);
            } else {
                renderCoursePreview(course, 'highlight-target', '');
            }
        }).on('mouseleave', function() {
            hideOverlapWarning();
            updateTimetableTextOnly();
        });
    }

    function renderCoursePreview(course, stateClass, fallbackLabel) {
        const slotsByDay = getSlotsByDay(course.slots);
        Object.keys(slotsByDay).forEach(day => {
            const info = slotsByDay[day];
            const middleIndex = Math.floor((info.indices.length - 1) / 2);
            const labelClass = getCourseLabelClass(course.name, info.indices.length);
            info.indices.forEach((p, idx) => {
                const $cell = $(`#cell-${p}`);
                $cell.addClass(stateClass);
                if (idx === 0) $cell.addClass('course-span-start');
                else if (idx === info.indices.length - 1) $cell.addClass('course-span-end');
                else $cell.addClass('course-span-middle');

                if (idx === middleIndex && stateClass === 'highlight-overlap') {
                    $cell.addClass(`course-cell-primary ${labelClass}`).html(`<span class="course-cell-name ${getCourseLineClass(course.name, info.indices.length)}">${fallbackLabel}</span><span class="course-cell-time">${info.label}</span>`);
                }
            });
        });
    }

    function getCourseConflicts(course) {
        const conflictMap = {};
        myRegistrations.forEach(reg => {
            const registeredCourse = window.courseData.find(c => c.id === reg.id);
            if (!registeredCourse) return;
            const registeredIndices = [];
            registeredCourse.slots.forEach(slot => {
                registeredIndices.push(...getPhysicalIndices(slot));
            });
            course.slots.forEach(slot => {
                getPhysicalIndices(slot).forEach(index => {
                    if (!registeredIndices.includes(index)) return;
                    const key = `${registeredCourse.id}-${slot}`;
                    if (!conflictMap[key]) {
                        conflictMap[key] = { course: registeredCourse, slots: [] };
                    }
                    if (!conflictMap[key].slots.includes(slot)) {
                        conflictMap[key].slots.push(slot);
                    }
                });
            });
        });

        return Object.values(conflictMap).map(item => ({
            course: item.course,
            time: translateSlots(item.slots)
        }));
    }

    function translateSlots(slots) {
        return translateTime(slots.join(','));
    }

    function buildOverlapMessage(course, conflicts) {
        const lines = conflicts.map(conflict => `<li><strong>${course.name}</strong> 강의가 <strong>${conflict.course.name}</strong> 강의와 <strong>${conflict.time}</strong>에 겹칩니다.</li>`).join('');
        return `<p style="margin:0 0 8px; color:var(--accent-red); font-weight:bold;">시간표가 중복되는 강좌가 있습니다.</p><ul style="margin:0; padding-left:18px; line-height:1.7;">${lines}</ul>`;
    }

    function showOverlapWarning(course, conflicts) {
        const first = conflicts[0];
        if (!first) return;
        const more = conflicts.length > 1 ? ` 외 ${conflicts.length - 1}건` : '';
        $('#overlap-warning')
            .html(`<strong>${course.name}</strong> 강의가 <strong>${first.course.name}</strong> 강의와 <strong>${first.time}</strong>에 겹칩니다${more}.`)
            .show();
    }

    function hideOverlapWarning() {
        $('#overlap-warning').hide().empty();
    }

    function updateTimetableTextOnly() {
        updateTimetableDisplay();
    }

    function renderCart() {
        const container = $('#cart-container').empty();
        const $empty = $('#cart-empty-msg');
        const $bulkBtn = $('.cart-bulk-btn');

        if (!myCart.length) {
            $empty.show();
            if ($bulkBtn.length) $bulkBtn.prop('disabled', true);
            return;
        }

        $empty.hide();
        if ($bulkBtn.length) $bulkBtn.prop('disabled', false);

        myCart.forEach((courseId, idx) => {
            const c = window.courseData.find(cd => cd.id === courseId);
            if (!c) return;
            const indexLabel = idx + 1;
            const isRegistered = myRegistrations.some(r => r.id === courseId);

            container.append(`
                <div class="course-card" data-id="${c.id}">
                    <div>
                        <span class="cart-index">${indexLabel}.</span>
                        <span class="category-tag tag-${c.category}">${c.category}</span>
                        <span class="course-name">${c.name}</span>
                    </div>
                    <div class="course-info">
                        ${c.prof} 교수 | ${c.dept} | ${c.credit}학점<br>
                        ${translateTime(c.time)}
                        ${isRegistered ? '<br><span style="color:var(--hallym-blue); font-weight:bold;">(이미 신청된 강좌)</span>' : ''}
                    </div>
                    <div class="cart-controls">
                        <button class="btn-cart-small" onclick="moveCartItem(${idx}, -1)">▲</button>
                        <button class="btn-cart-small" onclick="moveCartItem(${idx}, 1)">▼</button>

    window.addToCart = function(id) {
        const course = window.courseData.find(c => c.id === id);
        if (!course) return;
        if (myCart.includes(id)) {
            showModal('알림', `[${course.name}] 이미 장바구니에 담겨 있습니다.`, 'alert');
            return;
        }
        myCart.push(id);
        renderCart();
        showModal('장바구니 추가', `해당 강좌 ([${course.name}]) 가 장바구니에 담겼습니다.`, 'alert');
    };

    window.removeFromCart = function(id) {
        myCart = myCart.filter(cid => cid !== id);
        renderCart();
    };

    window.moveCartItem = function(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= myCart.length) return;
        const tmp = myCart[index];
        myCart[index] = myCart[newIndex];
        myCart[newIndex] = tmp;
        renderCart();
    };

    window.openCartBulkModal = function() {
        if (!myCart.length) {
            showModal('알림', '장바구니에 담긴 강좌가 없습니다.', 'alert');
            return;
        }
        const content = `
            일괄신청 시 장바구니 1번 강좌부터 순차적으로 수강신청을 시도합니다.<br><br>
            각 강좌를 신청하는 과정에서 서버 접속 대기열이 발생할 수 있습니다.<br>
            위 내용을 확인하셨다면 \'확인\' 버튼을 눌러 일괄신청을 진행해 주세요.
        `;
        showModal('장바구니 일괄신청 안내', content, 'confirm', function() {
            // 1번 강좌부터 순차적으로 기존 신청 로직 호출 (모달이 겹치지 않도록 순차 처리)
            const queue = myCart.slice(); // 현재 순서를 복사

            function processNext() {
                if (!queue.length) {
                    // 전체 일괄신청 완료 후 한 번만 완료 모달 출력
                    showModal('일괄신청 완료', '장바구니 일괄신청 처리가 완료되었습니다.', 'refresh');
                    return; // 모두 처리 완료
                }
                const courseId = queue.shift();
                // 정원 여유가 있는 과목은 확인 모달 없이 바로 신청, 대기 과목은 기존처럼 확인 모달 유지
                registerCourse(courseId, function() {
                    processNext();
                }, { skipConfirmIfNotFull: true, suppressSuccessModal: true });
            }

            processNext();
        });
    };

    window.registerCourse = function(id, onDone, options) {
        // onDone 없이 옵션만 넘기는 호출도 허용
        if (typeof onDone === 'object' && options === undefined) {
            options = onDone;
            onDone = undefined;
        }
        options = options || {};
        const course = window.courseData.find(c => c.id === id);
        
        if (myRegistrations.find(r => r.id === id)) {
            showModal("알림", `[${course.name}] 이미 신청된 강좌입니다.`, 'alert');
            return;
        }
        
        let currentTotal = 0;
        myRegistrations.forEach(r => {
            const rc = window.courseData.find(c => c.id === r.id);
            currentTotal += rc.credit;
        });

        if (currentTotal + course.credit > MAX_CREDITS) {
            showModal("수강신청 불가", `<p style='color:var(--accent-red); font-weight:bold;'>최대 신청 가능 학점(${MAX_CREDITS}학점)을 초과할 수 없습니다.</p>`, 'alert');
            return;
        }

        let regIndices = [];
        myRegistrations.forEach(r => {
            const rc = window.courseData.find(c => c.id === r.id);
            rc.slots.forEach(s => {
                regIndices = regIndices.concat(getPhysicalIndices(s));
            });
        });
        const myIndices = [];
        course.slots.forEach(s => {
            myIndices.push(...getPhysicalIndices(s));
        });
        
        const conflicts = getCourseConflicts(course);
        if (conflicts.length) {
            showModal("수강신청 불가", buildOverlapMessage(course, conflicts), 'alert');
            showOverlapWarning(course, conflicts);
            return;
        }

        const isFull = course.enr >= course.cap;
        const skipConfirmIfNotFull = options.skipConfirmIfNotFull && !isFull;
        const suppressSuccessModal = options.suppressSuccessModal;

        // 일괄신청 등에서, 정원 여유가 있는 과목은 확인 모달 없이 바로 신청 처리
        if (skipConfirmIfNotFull) {
            myRegistrations.push({ id: id, status: 'registered' });
            myCart = myCart.filter(cid => cid !== id);

            if (suppressSuccessModal) {
                updateUI();
                if (onDone) onDone();
            } else {
                showModal("신청 완료", "정상적으로 처리되었습니다.", 'refresh', function() {
                    if (onDone) onDone();
                });
            }
            return;
        }

        const msg = isFull ? `정원 초과입니다. [${course.name}] 대기 신청하시겠습니까?` : `[${course.name}] 신청하시겠습니까?`;
        
        showModal("수강신청 확인", msg, 'confirm', function() {
            if (isFull) {
                course.wait += 1;
                myRegistrations.push({ id: id, status: 'waiting', waitNo: course.wait });
            } else {
                myRegistrations.push({ id: id, status: 'registered' });
            }
            // 신청 성공 시 해당 강좌는 장바구니에서 제거
            myCart = myCart.filter(cid => cid !== id);
            if (suppressSuccessModal) {
                updateUI();
                if (onDone) onDone();
            } else {
                showModal("신청 완료", "정상적으로 처리되었습니다.", 'refresh', function() {
                    if (onDone) onDone();
                });
            }
        });
    };

    window.cancelCourse = function(id) {
        const reg = myRegistrations.find(r => r.id === id);
        showModal("취소 확인", "선택하신 강좌를 취소하시겠습니까?", 'confirm', function() {
            if (reg.status === 'waiting') {
                const c = window.courseData.find(item => item.id === id);
                if(c.wait > 0) c.wait -= 1;
            }
            myRegistrations = myRegistrations.filter(r => r.id !== id);
            showModal("취소 완료", "정상적으로 취소되었습니다.", 'refresh');
        });
    };

    function updateDiagnosis() {
        const taking = {};
        Object.keys(gradBase).forEach(k => {
            taking[k] = 0;
        });
        let totalSum = 0;

        myRegistrations.forEach(r => {
            const c = window.courseData.find(cd => cd.id === r.id);
            totalSum += c.credit;
            let key = (c.category === "전공") ? "주전공" : c.category;
            if (taking.hasOwnProperty(key)) taking[key] += c.credit;
        });

        const tbody = $('#diag-body').empty();
        Object.keys(gradBase).forEach(key => {
            const d = gradBase[key];
            const curTaking = (key === "총학점") ? totalSum : taking[key];
            let remain = Math.max(0, d.base - d.get - curTaking);
            
            tbody.append(`
                <tr>
                    <td class="category-col">${key}</td>
                    <td>${d.base || ""}</td>
                    <td>${d.get}</td>
                    <td class="val-reg">${curTaking}</td>
                    <td class="val-remain">${(key.includes("복수전공") && key !== "복수전공1") ? "" : remain}</td>
                    <td><button class="btn-lookup" onclick="showModal('${key} 세부기준','본 항목은 ${key} 영역의 세부기준 임시 데이터입니다.','info')">조회</button></td>
                </tr>
            `);
        });
    }

                container.append(`
                    <div class="course-card registered-card" data-id="${c.id}">
                        <span class="category-tag tag-${c.category}">${c.category}</span>

    function updateTimetableDisplay() {
        $('.day-cell').removeClass('fixed-course fixed-waiting course-cell-primary large-label compact-label xcompact-label course-span-start course-span-middle course-span-end highlight-target highlight-overlap highlight-registered-focus').empty();
        hideOverlapWarning();
        myRegistrations.forEach(reg => {
            const c = window.courseData.find(item => item.id === reg.id);
            const slotsByDay = getSlotsByDay(c.slots);
            Object.keys(slotsByDay).forEach(day => {
                const info = slotsByDay[day];
                const middleIndex = Math.floor((info.indices.length - 1) / 2);
                const labelClass = getCourseLabelClass(c.name, info.indices.length);
                info.indices.forEach((p, idx) => {
                    const $cell = $(`#cell-${p}`);
                    $cell.addClass(reg.status === 'waiting' ? 'fixed-waiting' : 'fixed-course');
                    if (idx === 0) $cell.addClass('course-span-start');
                    else if (idx === info.indices.length - 1) $cell.addClass('course-span-end');
                    else $cell.addClass('course-span-middle');

                    if (idx === middleIndex) {
                        $cell.addClass(`course-cell-primary ${labelClass}`).html(`<span class="course-cell-name ${getCourseLineClass(c.name, info.indices.length)}">${c.name}</span><span class="course-cell-time">${info.label}</span>`);
                    }
                });
            });

    function getCourseLabelClass(name, spanCount) {
        if (spanCount >= 3 && name.length <= 6) return 'large-label';
        if (spanCount <= 2 || name.length >= 12) return 'xcompact-label';
        if (name.length >= 8) return 'compact-label';
        return '';
    }

    function getCourseLineClass(name, spanCount) {
        return (spanCount <= 2 && name.length >= 9) ? 'single-line-label' : '';
    }

    function getSlotsByDay(slots) {
        const map = {};
        slots.forEach(slot => {
            const normalized = slot.toUpperCase();
            const day = normalized.substring(0, 3);
            const rawCode = normalized.substring(3).replace('-', '');
            if (!map[day]) map[day] = { rawCodes: [], indices: [] };
            map[day].rawCodes.push(rawCode);
            map[day].indices = map[day].indices.concat(getPhysicalIndices(normalized));
        });

        Object.keys(map).forEach(day => {
            map[day].indices = Array.from(new Set(map[day].indices)).sort((a, b) => {
                return parseInt(a.split('-')[1], 10) - parseInt(b.split('-')[1], 10);
            });
            map[day].label = buildDaySlotLabel(map[day].rawCodes);
        });
        return map;
    }

    function buildDaySlotLabel(rawCodes) {
        const numericCodes = rawCodes.filter(code => !isNaN(code)).map(Number).sort((a, b) => a - b);
        if (numericCodes.length) {
            const first = numericCodes[0];
            const last = numericCodes[numericCodes.length - 1];
            return first === last ? `${first}교시` : `${first}-${last}교시`;
        }
        const alphaCodes = Array.from(new Set(rawCodes)).sort();
        if (alphaCodes.length === 1) return `${alphaCodes[0]}교시`;
        return `${alphaCodes[0]}-${alphaCodes[alphaCodes.length - 1]}교시`;
    }

    window.openTab = function(tabId, btn) {
        $('.tab-content, .tab-btn').removeClass('active');
        $(`#${tabId}`).addClass('active'); $(btn).addClass('active');
    };

    function translateTime(timeStr) {
        const dayMap = { MON: '월', TUE: '화', WED: '수', THU: '목', FRI: '금' };
        const grouped = {};

        timeStr.toUpperCase().split(',').forEach(part => {
            const day = part.substring(0, 3);
            const code = part.substring(3).replace('-', '');
            if (!grouped[day]) grouped[day] = [];
            grouped[day].push(code);
        });

        return Object.keys(grouped).map(day => {
            const codes = grouped[day];
            const numericCodes = codes.filter(code => !isNaN(code)).map(Number).sort((a, b) => a - b);
            const label = numericCodes.length === codes.length
                ? buildConsecutivePeriodLabel(numericCodes)
                : Array.from(new Set(codes)).sort().join(', ');
            return `${dayMap[day] || day} ${label}교시`;
        }).join(' · ');
    }

    function buildConsecutivePeriodLabel(periods) {
        if (!periods.length) return '';
        const groups = [];
        let start = periods[0];
        let prev = periods[0];

        for (let i = 1; i < periods.length; i++) {
            if (periods[i] === prev + 1) {
                prev = periods[i];
                continue;
            }
            groups.push(start === prev ? `${start}` : `${start}-${prev}`);
            start = periods[i];
            prev = periods[i];
        }
        groups.push(start === prev ? `${start}` : `${start}-${prev}`);
        return groups.join(', ');
    }

    function showModal(title, content, type, onConfirm) {
        $('#modalTitle').text(title); $('#modalContent').html(content);
        const footer = $('#modalFooter').empty();
        
        if (type === 'confirm') {
            footer.append($('<button class="btn-modal-cancel">취소</button>').click(closeModal));
            footer.append($('<button class="btn-modal-confirm">확인</button>').click(() => { closeModal(); if(onConfirm) onConfirm(); }));
        } else if (type === 'refresh') {
            footer.append($('<button class="btn-modal-confirm">확인</button>').click(() => { closeModal(); updateUI(); if(onConfirm) onConfirm(); }));
        } else {
            footer.append($('<button class="btn-modal-close">닫기</button>').click(() => { closeModal(); if(onConfirm) onConfirm(); }));
        }
        $('#commonModal').css('display', 'flex');
    }

    function closeModal() { $('#commonModal').hide(); }
    window.showSyllabus = (id) => showModal("강의계획서", "본 강의는 전공 역량 강화를 위한 수업입니다.<br>출석 20%, 중간 30%, 기말 40%, 과제 10%", 'info');
    window.showDetails = (id) => { 
        const c = window.courseData.find(x=>x.id===id); 
        const remain = Math.max(0, c.cap - c.enr);
        showModal("강의 상세 정보", `강의코드: ${c.num}<br>교수명: ${c.prof}<br>대상학과: ${c.dept}<br>이수구분: ${c.category}<br>학점: ${c.credit}학점<br>수업시간: ${translateTime(c.time)}<br>신청인원: ${c.enr} / ${c.cap} (잔여 ${remain}석)<br>대기인원: ${c.wait}`, 'info'); 
    };
</script>
